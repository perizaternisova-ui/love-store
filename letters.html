<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Письма ❤️</title>

<link rel="stylesheet" href="letters.css">

</head>

<body>

<header class="page-header">
    <h1>💌 Письма</h1>
    <div class="tabs">

<button class="tab active" data-tab="love">
❤️ Любовь
</button>

<button class="tab" data-tab="memory">
📸 Воспоминания
</button>

<button class="tab" data-tab="future">
🌅 Будущее
</button>

<button class="tab" data-tab="distance">
✈️ Расстояние
</button>

</div>
</header>

<main>

<div id="lettersList"></div>


</main>

<div id="letterModal" class="modal">

<div class="modal-content">

<h2 id="modalTitle">Новое письмо ❤️</h2>

<select id="letterCategory">

<option value="love">
❤️ Любовь
</option>

<option value="memory">
📸 Воспоминания
</option>

<option value="future">
🌅 Будущее
</option>

<option value="distance">
✈️ Расстояние
</option>

</select>

<input
id="letterTitle"
type="text"
placeholder="Название письма">

<textarea
id="letterText"
placeholder="Напиши всё, что хочешь сказать..."
rows="12"></textarea>

<div class="modal-buttons">


<button id="saveBtn">
Сохранить
</button>

</div>

</div>

</div>

<script src="letters.js"></script>

</body>

</html>
