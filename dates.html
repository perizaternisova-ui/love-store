<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Наши даты ❤️</title>

<link rel="stylesheet" href="dates.css">

</head>

<body>

<header class="page-header">
<h1>📅 Наши даты</h1>
</header>


<main>

<div id="datesList"></div>

<button id="addDate">
    ➕ Добавить дату
</button>

</main>

<div id="dateModal" class="modal">

<div class="modal-content">

<h2 id="modalTitle">Новая дата ❤️</h2>

<input
id="titleInput"
type="text"
placeholder="Название даты">

<input
id="dateInput"
type="date">

<div class="modal-buttons">

<button id="cancelBtn">
Отмена
</button>

<button id="saveBtn">
Сохранить
</button>

</div>

</div>

</div>

<script src="dates.js"></script>
</body>
</html>
