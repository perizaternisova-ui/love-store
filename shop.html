<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Store — Магазин</title>

<link rel="stylesheet" href="style.css?v=2">

<body>

<header class="love-wallet">
    <div class="wallet-title">
        <h1>💖 Love Store</h1>
        <p>Магазин любви только для нас</p>
    </div>

    <div class="wallet-cards">

        <div class="wallet-card">
            <span class="wallet-icon">❤️</span>
            <div>
                <h3 id="balance">1000</h3>
                <p>Баланс</p>
            </div>
        </div>
        
</header>

<div id="hearts"></div>


<main class="shop">

<section>
<h2>💬 Общение</h2>
<div id="communication" class="cards"></div>
</section>

<section>
<h2>⏳ Время</h2>
<div id="time" class="cards"></div>
</section>

<section>
<h2>🌹 Романтика</h2>
<div id="romance" class="cards"></div>
</section>

<section>
<h2>🍰 Вкусности</h2>
<div id="food" class="cards"></div>
</section>

<section>
<h2>🤍 Забота</h2>
<div id="care" class="cards"></div>
</section>

<section>
<h2>🎨 Творчество</h2>
<div id="creative" class="cards"></div>
</section>

<section>
<h2>🎯 Испытания</h2>
<div id="challenge" class="cards"></div>
</section>

<section>
<h2>👑 Эксклюзив</h2>
<div id="exclusive" class="cards"></div>
</section>

<section>
<h2>🔥 Желания</h2>
<div id="wish" class="cards"></div>
</section>

</main>

<div class="modal" id="purchaseModal">

    <div class="modal-content">

        <div class="modal-emoji" id="modalEmoji">💖</div>

        <h2 id="modalTitle">Название</h2>

        <p id="modalDescription">Описание</p>

        <div class="modalPrice" id="modalPrice">
            ❤️ 0
        </div>

        <div class="modalButtons">

            <button class="cancelBtn" id="cancelBtn">
                Отмена
            </button>

            <button class="confirmBtn" id="confirmBtn">
                Купить
            </button>

        </div>

    </div>

</div>
