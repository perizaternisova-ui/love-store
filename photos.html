<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Наши фото ❤️</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="photos.css">

</head>

<body>

<a href="love.html" class="back-btn">
    ← Назад
</a>

<h1 class="title">
📸 Наши фото
</h1>

<p class="subtitle">
Наши самые тёплые воспоминания ❤️
</p>

<div class="top-buttons">

<button id="addPhotoBtn">
➕ Добавить фото
</button>

</div>

<input
type="file"
id="photoInput"
accept="image/*"
style="display:none;"
>

<div id="gallery" class="gallery">

</div>

<div id="photoModal" class="photo-modal">

<div class="photo-window">

<span id="closePhoto">✕</span>

<img id="fullPhoto">

<textarea
id="photoCaption"
placeholder="Напиши подпись..."
></textarea>

<input
type="date"
id="photoDate">

<div class="modal-buttons">

<button id="saveCaption">
💾 Сохранить
</button>

</div>

</div>

</div>

<script src="photos.js"></script>

</body>

</html>
